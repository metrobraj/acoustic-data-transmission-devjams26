<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirChirp // Secure Acoustic Link</title>
    
    <!-- fflate compression library -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Your custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ============================================
             HEADER
             ============================================ -->
        <header class="cyber-header">
            <div class="header-titles">
                <h1>AIRCHIRP // SECURE ACOUSTIC LINK</h1>
                <p class="subtitle">SYSTEM STANDBY // AWAITING MODE SELECTION</p>
            </div>
            <div class="status-indicator">
                <span class="dot standby" id="statusDot"></span>
            </div>
        </header>

        <main class="dashboard">
            
            <!-- ============================================
                 SECURITY PANEL
                 ============================================ -->
            <section class="panel security-panel">
                <h2>[ ENCRYPTION KEY ]</h2>
                <input type="password" id="secretKey" placeholder="E N T E R   K E Y" />
            </section>

            <!-- ============================================
                 MODE SELECTOR
                 ============================================ -->
            <section class="panel mode-selector">
                <h2>[ SELECT TERMINAL ROLE ]</h2>
                <div class="segmented-control">
                    <span class="glider"></span>
                    <button id="btnModeTx" class="segment-btn active">ENGAGE TRANSMITTER (TX)</button>
                    <button id="btnModeRx" class="segment-btn">ENGAGE RECEIVER (RX)</button>
                </div>
            </section>

            <!-- ============================================
                 DYNAMIC WORKSPACE
                 ============================================ -->
            <div id="dynamicWorkspace">
                
                <!-- ============================================
                     TRANSMITTER PANEL
                     ============================================ -->
                <section id="txPanel" class="panel workspace-panel">
                    <h2>[ TX // SELECT FILE ]</h2>
                    
                    <label for="fileInput" class="file-drop-zone">
                        <input type="file" id="fileInput" class="file-input" />
                        <span class="file-label">Click to Browse or Drag File Here</span>
                    </label>
                    
                    <div class="file-metadata">
                        <span id="fileName">No file selected.</span>
                        <span id="fileSize">0 KB</span>
                    </div>
                    
                    <button id="btnTransmit" class="btn-primary" disabled>INITIATE CHIRP</button>
                </section>

                <!-- ============================================
                     RECEIVER PANEL
                     ============================================ -->
                <section id="rxPanel" class="panel workspace-panel hidden">
                    <h2>[ RX // AWAITING DATA ]</h2>
                    <button id="btnReceive" class="btn-secondary">OPEN MIC BUFFER</button>
                    
                    <div class="download-zone hidden" id="downloadZone">
                        <p>✅ File Decoded Successfully!</p>
                        <a id="downloadLink" class="btn-download" download>💾 DOWNLOAD SECURE FILE</a>
                    </div>
                </section>
                
            </div>

            <!-- ============================================
                 SPECTROGRAM VISUALIZATION
                 ============================================ -->
            <section class="panel visualizer-panel">
                <h2>[ REAL-TIME FFT ANALYSIS ]</h2>
                <div class="canvas-container">
                    <canvas id="spectrogramCanvas"></canvas>
                </div>
            </section>
            
        </main>
    </div>

    <!-- ============================================
         SCRIPTS (Order Matters!)
         ============================================ -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/audio.js"></script>
    <script src="assets/js/initialization.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
